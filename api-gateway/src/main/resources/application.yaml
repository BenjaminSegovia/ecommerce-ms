spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: producto-service-productos
              uri: lb://producto-service
              predicates:
                - Path=/api/v1/productos/**

            - id: producto-service-categorias
              uri: lb://producto-service
              predicates:
                - Path=/api/v1/categorias/**

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/